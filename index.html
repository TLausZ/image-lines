<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image lines</title>
<!--
  image lines, browser port of https://github.com/cfloutier/image_lines
  Original: Copyright (C) cfloutier, LGPL-2.1-or-later
  Port:     Copyright (C) 2026 TLausZ, LGPL-2.1-or-later (see LICENSE)
-->
<style>
  :root {
    --paper: #ece2cd;
    --paper-bright: #f2ead6;
    --ink: #5c4a34;
    --ink-soft: #6b5a42;
    --ink-faint: #8a7a5e;
    --line: rgba(74,58,40,0.68);
    --border: rgba(110,92,64,0.25);
    --border-strong: rgba(110,92,64,0.4);
    --accent: rgba(150,90,50,0.95);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    background: var(--paper);
    color: var(--ink-faint);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 61px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--ink); }
  header .sub { font-size: 12px; color: var(--ink-faint); }
  header .sub a { color: inherit; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    margin-right: 276px;
    min-width: 0;
    overflow: hidden;
    transition: margin-left .2s, margin-right .2s;
  }
  #stage.mleft { margin-left: 276px; }
  #stage.wide { margin-right: 0; }
  #panel.hidden { transform: translateX(277px); }
  .tab {
    position: fixed;
    top: 73px;
    z-index: 3;
    width: 29px;
    height: 29px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    line-height: 27px;
    padding: 0;
    transition: right .2s, left .2s;
  }
  #ptoggle { right: 276px; }
  #ptoggle.hidden { right: 8px; }
  #etoggle { left: 276px; }
  #etoggle.hidden { left: 8px; }
  #exportPanel {
    position: fixed;
    top: 61px;
    left: 0;
    bottom: 0;
    width: 276px;
    background: var(--paper);
    border-right: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .2s;
  }
  #exportPanel.hidden { transform: translateX(-277px); }
  input[type=number] {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 8px;
    width: 100%;
  }
  #wrapper { position: relative; display: flex; overflow: visible; }
  #wrapper.circle #view { cursor: crosshair; }
  #marker {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 1px solid var(--paper-bright);
    transform: translate(-50%, -50%);
    cursor: grab;
  }
  #marker[hidden] { display: none; }
  #view {
    display: block;
    border: 1px solid var(--border);
    background: var(--paper);
  }
  #panel {
    position: fixed;
    top: 61px;
    right: 0;
    bottom: 0;
    width: 276px;
    background: var(--paper);
    border-left: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .2s;
  }
  .btnrow { display: flex; gap: 8px; align-items: center; }
  #panel > button, #exportPanel > button { flex: none; }
  #modeStraight, #modeCircle, #modeSinus, #ctrlSinusDir { display: flex; flex-direction: column; gap: 12px; }
  #modeStraight[hidden], #modeCircle[hidden], #modeSinus[hidden] { display: none; }
  button {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    flex: 1;
  }
  button.active { background: var(--ink); color: var(--paper-bright); }
  .ctrl label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .ctrl .val { color: var(--ink); }
  .ctrl input.edit { width: 64px; padding: 0 4px; text-align: right; font: inherit; color: var(--ink);
    background: transparent; border: 1px solid var(--border); border-radius: 4px; }
  .ctrl input[type=range] { width: 100%; accent-color: var(--ink); height: 16px; }
  select {
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 8px;
    width: 100%;
  }
  .hint { font-size: 12px; color: var(--ink-faint); }
  .help {
    display: inline-block;
    width: 13px;
    height: 13px;
    line-height: 12px;
    text-align: center;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    font-size: 10px;
    color: var(--ink-faint);
    cursor: help;
    margin-left: 4px;
  }
  #helpPop {
    margin: 0;
    background: var(--paper);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 12px;
    max-width: 260px;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-soft);
  }
  #helpTitle { color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  hr { border: none; border-top: 1px solid var(--border); }
  #status { font-size: 12px; color: var(--ink-faint); min-height: 17px; }
</style>
</head>
<body>
<header>
  <div><h1>image lines</h1><div class="sub">browser port of <a href="https://github.com/cfloutier/image_lines">github.com/cfloutier/image_lines</a></div></div>
  <div class="sub" id="imginfo">drop an image anywhere</div>
</header>
<main>
  <div id="stage"><div id="wrapper"><canvas id="view"></canvas><div id="marker" hidden></div></div></div>
  <div id="panel">
    <div class="btnrow">
      <button id="btnLoad">load image</button>
      <button id="btnExample">example</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" hidden>
    <div class="btnrow">
      <button id="btnLoadSettings">load settings</button>
      <button id="btnSaveSettings">save settings</button>
    </div>
    <input type="file" id="settingsInput" accept=".json,application/json" hidden>

    <div class="hint">image</div>
    <div id="ctrlImage"></div>

    <hr>
    <div class="hint">lines</div>
    <div class="ctrl">
      <label><span>curve type<span class="help" data-title="curve type" data-help="straight: parallel lines, circles: concentric around a centre, sinus: parallel sine waves">?</span></span></label>
      <select id="typeSel">
        <option value="0">lines</option>
        <option value="1">circles</option>
        <option value="2">sinus</option>
      </select>
    </div>
    <div id="ctrlLines"></div>
    <div id="modeStraight">
      <div class="btnrow" id="dirButtons">
        <button data-dir="0">&#8212;</button>
        <button data-dir="-45">///</button>
        <button data-dir="90">|||</button>
        <button data-dir="45">\\\</button>
      </div>
      <div id="ctrlStraight"></div>
    </div>
    <div id="modeCircle" hidden>
      <div id="ctrlCircle"></div>
      <div class="hint">click on the image sets the centre, drag the marker moves it</div>
      <div class="btnrow">
        <button id="btnCenter">center</button>
        <button id="btnCircle">circle</button>
        <button id="btnFit">fit</button>
      </div>
    </div>
    <div id="modeSinus" hidden>
      <div id="ctrlSinusDir"></div>
      <div id="ctrlSinus"></div>
    </div>

    <hr>
    <div class="hint">threshold</div>
    <div class="btnrow">
      <button id="btnBlack" class="active">black lines</button>
      <span class="help" data-title="black lines" data-help="on: draw in dark areas, off: draw in bright areas">?</span>
    </div>
    <div class="ctrl">
      <label><span>distribution<span class="help" data-title="distribution" data-help="threshold order across adjacent lines, mirror and hachures keep hatch separation, bisect and interleaved spread transitions">?</span></span></label>
      <select id="distSel">
        <option value="0">progressive</option>
        <option value="1" selected>mirror</option>
        <option value="2">hachures</option>
        <option value="3">interleaved</option>
        <option value="4">bisect</option>
        <option value="5">bisect bfs</option>
      </select>
    </div>
    <div id="ctrlThreshold"></div>

    <hr>
    <button id="btnReset">reset values</button>
    <button id="btnExport">export</button>
    <div id="status"></div>
  </div>
  <div id="exportPanel" class="hidden">
    <div class="hint">export</div>
    <div id="ctrlExport"></div>
    <div class="ctrl">
      <label><span>paper<span class="help" data-title="paper" data-help="svg in mm with the margin below, orientation follows the image, none: pixel size">?</span></span></label>
      <select id="paperSel">
        <option value="" selected>none (pixels)</option>
        <option value="841,1189" data-slug="A0">A0</option>
        <option value="594,841" data-slug="A1">A1</option>
        <option value="420,594" data-slug="A2">A2</option>
        <option value="297,420" data-slug="A3">A3</option>
        <option value="210,297" data-slug="A4">A4</option>
        <option value="148,210" data-slug="A5">A5</option>
        <option value="863.6,1117.6" data-slug="ANSI-E">ANSI E (34 x 44 in)</option>
        <option value="558.8,863.6" data-slug="ANSI-D">ANSI D (22 x 34 in)</option>
        <option value="431.8,558.8" data-slug="ANSI-C">ANSI C (17 x 22 in)</option>
        <option value="279.4,431.8" data-slug="Tabloid">Tabloid (11 x 17 in)</option>
        <option value="215.9,355.6" data-slug="Legal">Legal (8.5 x 14 in)</option>
        <option value="215.9,279.4" data-slug="Letter">Letter (8.5 x 11 in)</option>
        <option value="139.7,215.9" data-slug="Half-Letter">Half Letter (5.5 x 8.5 in)</option>
        <optgroup label="envelopes EU">
          <option value="229,324" data-slug="Env-C4">C4 (229 x 324 mm)</option>
          <option value="162,229" data-slug="Env-C5">C5 (162 x 229 mm)</option>
          <option value="114,229" data-slug="Env-C6-5">C6/5 (114 x 229 mm)</option>
          <option value="114,162" data-slug="Env-C6">C6 (114 x 162 mm)</option>
          <option value="110,220" data-slug="Env-DL">DL (110 x 220 mm)</option>
          <option value="176,250" data-slug="Env-B5">B5 (176 x 250 mm)</option>
          <option value="125,176" data-slug="Env-B6">B6 (125 x 176 mm)</option>
        </optgroup>
        <optgroup label="envelopes US">
          <option value="254,330.2" data-slug="Env-10x13">10 x 13 in</option>
          <option value="228.6,304.8" data-slug="Env-9x12">9 x 12 in</option>
          <option value="152.4,228.6" data-slug="Env-6x9">6 x 9 in</option>
          <option value="104.775,241.3" data-slug="Env-No10">#10 (4.125 x 9.5 in)</option>
          <option value="98.425,225.425" data-slug="Env-No9">#9 (3.875 x 8.875 in)</option>
          <option value="146.05,222.25" data-slug="Env-A9">A9 (5.75 x 8.75 in)</option>
          <option value="133.35,184.15" data-slug="Env-A7">A7 (5.25 x 7.25 in)</option>
          <option value="120.65,165.1" data-slug="Env-A6">A6 (4.75 x 6.5 in)</option>
          <option value="111.125,146.05" data-slug="Env-A2">A2 (4.375 x 5.75 in)</option>
        </optgroup>
      </select>
    </div>
    <div class="ctrl">
      <label>margin <span class="hint">mm, paper only</span></label>
      <input type="number" id="paperMargin" value="10" min="0" max="100" step="1">
    </div>
    <button id="btnDlSvg">download svg</button>
    <hr>
    <div class="ctrl">
      <label>raster export <span class="hint">long edge in px</span></label>
      <div class="btnrow">
        <input type="number" id="pngSize" value="2048" min="200" max="6000" step="100">
        <select id="pngFmt"><option value="image/png">png</option><option value="image/webp">webp</option></select>
      </div>
    </div>
    <div class="btnrow" id="pngSizes"><button>1280</button><button>2048</button><button>6000</button></div>
    <button id="btnDlPng">download raster</button>
  </div>
</main>
<div id="helpPop" popover>
  <div id="helpTitle"></div>
  <div id="helpText"></div>
</div>
<button id="ptoggle" class="tab" title="show/hide menu">&rsaquo;</button>
<button id="etoggle" class="tab hidden" title="show/hide export">&lsaquo;</button>

<script src="lines.js"></script>
<script>
'use strict';
const L = ImageLines;
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------
// Parameters. Names and ranges follow the Processing sketch.
// ---------------------------------------------------------------
const P = {
  Width: 500, Blur: 2, levelsMin: 0, levelsMax: 255, levelsGamma: 0, imageAlpha: 0,   // DataImage
  // start values from Settings/default.json of the original
  type: 0, lines_spacing: 1.13, precision: 3.6, direction: -44.4, size: 1144,   // DataLines, StraightLinesData, shared with sinus
  min_radius: 0, max_radius: 1000, center_x: 0, center_y: 0, ellipse: 0,          // CircleLinesData
  high: 20, period: 100,                                                            // SinusLinesData
  lineWidth: 1,   // Style.lineWidth, 0.3 mm per unit on paper
  black: true, distribution_mode: 1, nb_values: 6, power: -0.13, min_value: 0, max_value: 229.5, // DataThreshold
};

const SLIDERS = {
  ctrlImage: [
    { key: 'Width', help: 'working width in px, drawing has the same size, larger: more detail, slower',  label: 'width',  min: 200, max: 2000, step: 10 },
    { key: 'Blur', help: 'blur radius before sampling, smooths noise',   label: 'blur',   min: 0,   max: 20,   step: 1 },
    { key: 'levelsMin', help: 'input black point, pixels at or below become black', label: 'levels min', min: 0, max: 254, step: 1 },
    { key: 'levelsMax', help: 'input white point, pixels at or above become white', label: 'levels max', min: 1, max: 255, step: 1 },
    { key: 'levelsGamma', help: 'gamma, 0 neutral, above 0 brightens midtones, below 0 darkens them', label: 'levels gamma', min: -1, max: 1, step: 0.01 },
    { key: 'imageAlpha', redraw: true, help: 'shows the processed image under the lines, preview only, not exported', label: 'image alpha', min: 0, max: 255, step: 1 },
  ],
  ctrlLines: [
    { key: 'lines_spacing', help: 'distance between adjacent lines in px', label: 'lines spacing', min: 0.5, max: 10, step: 0.01 },
    { key: 'precision', help: 'sampling step along each line, lower: smoother, slower, circles need 0.5 to 1', label: 'precision', min: 0.5, max: 10, step: 0.1 },
  ],
  ctrlStraight: [
    { key: 'direction', help: 'line angle in degrees, buttons: 0, -45, 90, 45', label: 'direction', min: -90, max: 90, step: 0.1 },
    { key: 'size', help: 'half-length of the lines around the centre, must cover the image corners', label: 'size', min: 10, max: 2000, step: 1 },
  ],
  ctrlCircle: [
    { key: 'min_radius', edit: true, help: 'radius of the innermost circle, type a value to go beyond the slider', label: 'min radius', min: 0, max: 3000, step: 1 },
    { key: 'max_radius', edit: true, help: 'radius of the outermost circle, type a value to go beyond the slider, fit covers the image', label: 'max radius', min: 0, max: 3000, step: 1 },
    { key: 'center_x', edit: true, help: 'centre offset from the image centre in px, type a value to go beyond the slider or outside the image', label: 'center x', min: -2000, max: 2000, step: 1 },
    { key: 'center_y', edit: true, help: 'centre offset from the image centre in px, type a value to go beyond the slider or outside the image', label: 'center y', min: -2000, max: 2000, step: 1 },
    { key: 'ellipse', help: 'ellipse ratio, 0: circle, positive: wide, negative: tall', label: 'ellipse', min: -3, max: 3, step: 0.01 },
  ],
  ctrlSinus: [
    { key: 'high', help: 'wave amplitude in px, keep small relative to spacing', label: 'amplitude', min: 0, max: 100, step: 0.5 },
    { key: 'period', help: 'wavelength in px', label: 'period', min: 1, max: 400, step: 0.5 },
  ],
  ctrlExport: [
    { key: 'lineWidth', help: 'stroke width in the svg, 0.3 mm per unit on paper', label: 'line width', min: 0.25, max: 3, step: 0.25 },
  ],
  ctrlThreshold: [
    { key: 'nb_values', help: 'number of threshold levels, above 1: halftone-like bands', label: 'nb values', min: 1,   max: 12,  step: 1 },
    { key: 'power', help: 'threshold curve, 0 linear, above 0 packs thresholds into the dark end (fewer lines), below 0 into the bright end (more lines)',     label: 'power',     min: -10, max: 10,  step: 0.01 },
    { key: 'min_value', help: 'lower tonal clamp before thresholding', label: 'min',       min: 0,   max: 255, step: 0.1 },
    { key: 'max_value', help: 'upper tonal clamp before thresholding', label: 'max',       min: 0,   max: 255, step: 0.1 },
  ],
};

function attachHelp(el, title, text) {
  const pop = $('helpPop');
  el.addEventListener('mouseenter', () => {
    if (pop.matches(':popover-open')) pop.hidePopover();
    $('helpTitle').textContent = title;
    $('helpText').textContent = text;
    pop.showPopover();
    // left of the icon, vertically centred on it
    const r = el.getBoundingClientRect(), pr = pop.getBoundingClientRect();
    pop.style.left = Math.max(8, r.left - pr.width - 8) + 'px';
    pop.style.top = Math.max(8, Math.min(innerHeight - pr.height - 8, r.top + r.height / 2 - pr.height / 2)) + 'px';
  });
  el.addEventListener('mouseleave', () => { if (pop.matches(':popover-open')) pop.hidePopover(); });
}

const inputs = {};
for (const [box, list] of Object.entries(SLIDERS)) {
  for (const s of list) {
    const div = document.createElement('div');
    div.className = 'ctrl';
    // s.edit: the value is a number field, accepts values outside the slider range
    const valEl = s.edit ? `<input type="number" class="val edit" step="${s.step}">` : `<span class="val"></span>`;
    div.innerHTML = `<label><span>${s.label}<span class="help">?</span></span>${valEl}</label>
      <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${P[s.key]}">`;
    $(box).appendChild(div);
    attachHelp(div.querySelector('.help'), s.label, s.help);
    const input = div.querySelector('input[type=range]'), val = div.querySelector('.val');
    const show = () => { if (s.edit) val.value = P[s.key]; else val.textContent = String(+input.value); };
    show();
    // s.redraw: display only, no recompute
    input.addEventListener('input', () => { P[s.key] = +input.value; show(); if (s.redraw) draw(); else schedule(); });
    if (s.edit) val.addEventListener('change', () => { P[s.key] = +val.value || 0; input.value = P[s.key]; schedule(); });
    inputs[s.key] = { input, show };
  }
}
const setParam = (k, v) => { P[k] = v; inputs[k].input.value = v; inputs[k].show(); schedule(); };

for (const b of $('dirButtons').querySelectorAll('button'))
  b.addEventListener('click', () => setParam('direction', +b.dataset.dir));
$('typeSel').addEventListener('change', () => {
  P.type = +$('typeSel').value;
  $('modeStraight').hidden = P.type !== 0;
  $('modeCircle').hidden = P.type !== 1;
  $('modeSinus').hidden = P.type !== 2;
  $('wrapper').classList.toggle('circle', P.type === 1);
  placeMarker();
  // direction and size are shared by straight and sinus: move their controls into the visible group
  (P.type === 2 ? $('ctrlSinusDir') : $('modeStraight')).prepend($('dirButtons'), $('ctrlStraight'));
  schedule();
});
$('btnCenter').addEventListener('click', () => { setParam('center_x', 0); setParam('center_y', 0); });
$('btnCircle').addEventListener('click', () => setParam('ellipse', 0));
// fit: ring from the nearest image edge to the farthest corner, so the circles cover the image
$('btnFit').addEventListener('click', () => {
  if (!img) return;
  const hw = img.w / 2, hh = img.h / 2, cx = P.center_x, cy = P.center_y;
  const dx = Math.max(0, Math.abs(cx) - hw), dy = Math.max(0, Math.abs(cy) - hh);
  setParam('min_radius', Math.floor(Math.hypot(dx, dy)));
  setParam('max_radius', Math.ceil(Math.hypot(Math.abs(cx) + hw, Math.abs(cy) + hh)));
});
$('btnBlack').addEventListener('click', () => {
  P.black = !P.black; $('btnBlack').classList.toggle('active', P.black); schedule();
});
$('distSel').addEventListener('change', () => { P.distribution_mode = +$('distSel').value; schedule(); });

const DEFAULTS = { ...P };
$('btnReset').addEventListener('click', () => {
  Object.assign(P, DEFAULTS, { type: P.type });   // keep the curve type
  for (const k in inputs) { inputs[k].input.value = P[k]; inputs[k].show(); }
  $('btnBlack').classList.toggle('active', P.black);
  $('distSel').value = P.distribution_mode;
  schedule();
});

// ---------------------------------------------------------------
// Image: resize to Width, blur, keep pixel data (xLib_Image.pde)
// ---------------------------------------------------------------
let source = null;   // HTMLImageElement
let imgName = 'image';
let drawn = [];      // filtered polylines, flat [x0,y0,x1,y1,...] centered on image
let img = null;      // { w, h, data: Uint8ClampedArray }

function buildTransformedImage() {
  if (!source) { img = null; return; }
  const w = Math.floor(P.Width), h = Math.floor(source.height * P.Width / source.width);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  // ponytail: canvas blur instead of Processing's BLUR kernel, radius roughly matches
  if (P.Blur > 0) ctx.filter = `blur(${P.Blur}px)`;
  ctx.drawImage(source, 0, 0, w, h);
  const id = ctx.getImageData(0, 0, w, h);
  L.applyLevels(P, id.data);
  ctx.putImageData(id, 0, 0);            // keep the processed image for the alpha overlay
  img = { w, h, data: id.data, canvas: c };
}

// ---------------------------------------------------------------
// Draw
// ---------------------------------------------------------------
const view = $('view');
let timer = 0;
function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 30); }

function rebuild() {
  if (!source) return;
  const t0 = performance.now();
  buildTransformedImage();
  const lines = L.buildLines(P);
  drawn = L.applyThreshold(P, lines, img);
  fitView();
  $('status').textContent = `${lines.length} lines, ${drawn.length} segments, ${Math.round(performance.now() - t0)} ms`;
}

// draw at device resolution: backing store = css size * devicePixelRatio
function draw() {
  const k = parseFloat(view.style.width) / img.w * (devicePixelRatio || 1);
  view.width = Math.round(img.w * k); view.height = Math.round(img.h * k);
  const ctx = view.getContext('2d');
  const css = getComputedStyle(document.body);
  ctx.fillStyle = css.getPropertyValue('--paper');
  ctx.fillRect(0, 0, view.width, view.height);
  ctx.strokeStyle = css.getPropertyValue('--line');
  ctx.lineWidth = P.lineWidth;
  ctx.setTransform(k, 0, 0, k, img.w / 2 * k, img.h / 2 * k);
  if (P.imageAlpha > 0) {
    ctx.globalAlpha = P.imageAlpha / 255;
    ctx.drawImage(img.canvas, -img.w / 2, -img.h / 2);
    ctx.globalAlpha = 1;
  }
  ctx.beginPath();
  for (const pts of drawn) {
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  }
  ctx.stroke();
}

// Export (0.3 mm per line width unit, margin from #paperMargin)
// ---------------------------------------------------------------
const svgNow = () => L.buildSvg(P, drawn, img, $('paperSel').value ? $('paperSel').value.split(',').map(Number) : null, Math.max(0, +$('paperMargin').value || 0));
function exportName(ext) {
  const opt = $('paperSel').selectedOptions[0];
  const suffix = opt.value ? '-' + opt.dataset.slug + (img.w > img.h ? '-landscape' : '-portrait') : '';
  return imgName + '-lines' + suffix + '.' + ext;
}
function download(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name; a.click();
}
$('btnDlSvg').addEventListener('click', () => {
  if (!img) return;
  const url = URL.createObjectURL(new Blob([svgNow()], { type: 'image/svg+xml' }));
  download(url, exportName('svg'));
  URL.revokeObjectURL(url);
});
$('pngSizes').onclick = e => { if (e.target.tagName === 'BUTTON') $('pngSize').value = e.target.textContent; };
$('btnDlPng').addEventListener('click', () => {
  if (!img) return;
  const size = Math.min(6000, Math.max(200, +$('pngSize').value || 2048));
  const im = new Image();
  const url = URL.createObjectURL(new Blob([svgNow()], { type: 'image/svg+xml' }));
  im.onload = () => {
    URL.revokeObjectURL(url);
    const cv = document.createElement('canvas');
    const k = size / Math.max(im.naturalWidth, im.naturalHeight);
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(im, 0, 0, cv.width, cv.height);
    // quality 1 = lossless webp in chromium; browsers without webp encoder fall back to png
    const href = cv.toDataURL($('pngFmt').value, 1);
    if (!href.startsWith('data:image/png')) return download(href, exportName('webp'));
    // png: add Software and Comment text chunks (webp is left without metadata)
    const raw = Uint8Array.from(atob(href.split(',')[1]), ch => ch.charCodeAt(0));
    const png = L.pngWithText(raw, { Software: 'created with ' + L.CREATED_WITH, Comment: JSON.stringify(L.exportSettings(P)) });
    const url2 = URL.createObjectURL(new Blob([png], { type: 'image/png' }));
    download(url2, exportName('png'));
    URL.revokeObjectURL(url2);
  };
  im.src = url;
});

// ---------------------------------------------------------------
// Circle centre: click sets, drag moves (image coordinates, centred)
// ---------------------------------------------------------------
// fit the canvas into the stage, keeping the aspect ratio
function fitView() {
  if (!img) return;
  const st = $('stage').getBoundingClientRect();
  const k = Math.min((st.width - 32) / img.w, (st.height - 32) / img.h);
  view.style.width = img.w * k + 'px';
  view.style.height = img.h * k + 'px';
  draw();
  placeMarker();
}
function placeMarker() {
  const m = $('marker');
  m.hidden = P.type !== 1 || !img;
  if (m.hidden) return;
  const r = view.getBoundingClientRect();
  m.style.left = (P.center_x + img.w / 2) * r.width / img.w + 'px';
  m.style.top = (P.center_y + img.h / 2) * r.height / img.h + 'px';
}
function setCentre(e) {
  const r = view.getBoundingClientRect();
  setParam('center_x', Math.round((e.clientX - r.left) * img.w / r.width - img.w / 2));
  setParam('center_y', Math.round((e.clientY - r.top) * img.h / r.height - img.h / 2));
  placeMarker();
}
view.addEventListener('click', e => { if (P.type === 1 && img) setCentre(e); });
$('marker').addEventListener('pointerdown', e => {
  e.preventDefault();
  $('marker').setPointerCapture(e.pointerId);
  const move = ev => setCentre(ev);
  $('marker').addEventListener('pointermove', move);
  $('marker').addEventListener('pointerup', () => $('marker').removeEventListener('pointermove', move), { once: true });
});
addEventListener('resize', fitView);

function loadSrc(src, name) {
  const im = new Image();
  im.onload = () => {
    source = im;
    imgName = name.replace(/\.[^.]+$/, '');
    $('imginfo').textContent = `${name} ${im.width}x${im.height}`;
    if (src.startsWith('blob:')) URL.revokeObjectURL(src);
    rebuild();
  };
  im.src = src;
}
function loadFile(file) {
  if (file && file.type.startsWith('image/')) loadSrc(URL.createObjectURL(file), file.name);
}

// ---------------------------------------------------------------
// Settings: flat json of P; also reads the original's Settings/*.json layout
// ---------------------------------------------------------------
function applySettings(o) {
  if (o.Lines || o.Threshold || o.Image) o = fromOriginal(o);
  for (const k in P) if (k in o && typeof o[k] === typeof P[k]) P[k] = o[k];
  for (const k in inputs) { inputs[k].input.value = P[k]; inputs[k].show(); }
  $('btnBlack').classList.toggle('active', P.black);
  $('distSel').value = P.distribution_mode;
  $('typeSel').value = P.type;
  $('typeSel').dispatchEvent(new Event('change'));
}
function fromOriginal(o) {
  const I = o.Image || {}, Ln = o.Lines || {}, T = o.Threshold || {}, S = o.Style || {};
  const st = Ln.StraightLines || {}, ci = Ln.CircleLines || {}, si = Ln.SinusLines || {};
  const r = { ...I, ...Ln, ...T, ...ci, high: si.high, period: si.period, lineWidth: S.lineWidth };
  if (Ln.type === 2) { r.direction = si.direction_sinus; r.size = si.size; }
  else { r.direction = st.direction; r.size = st.size; }
  return r;
}
$('btnSaveSettings').addEventListener('click', () => {
  const json = JSON.stringify({ created_with: L.CREATED_WITH, ...P }, null, 2);
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  download(url, imgName + '-lines.json');
  URL.revokeObjectURL(url);
});
$('btnLoadSettings').addEventListener('click', () => $('settingsInput').click());
$('settingsInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => applySettings(JSON.parse(t.replace(/^\uFEFF/, '')))).catch(() => { $('status').textContent = 'settings file not readable'; });
  e.target.value = '';
});

$('btnLoad').addEventListener('click', () => $('fileInput').click());

document.addEventListener('dragover', e => e.preventDefault());
